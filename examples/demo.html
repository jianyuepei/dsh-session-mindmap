      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) { if (blob) download(payload.fileBase + '.png', blob); });
      URL.revokeObjectURL(svgUrl);
    };
    image.onerror = function () { URL.revokeObjectURL(svgUrl); };
    image.src = svgUrl;
  }

  var actions = {
    expand: function () { collapsed = {}; render(); fit(); },
    collapse: function () {
      collapsed = {};
      (function walk(node) { if (node.children && node.children.length) { collapsed[node.id] = true; for (var i = 0; i < node.children.length; i++) walk(node.children[i]); } })(map.root);
      delete collapsed[map.root.id];
      render(); fit();
    },
    fit: function () { fit(); },
    png: exportPng,
    copy: function (button) {
      var text = payload.markdown;
      var done = function () {
        if (!button) return;
        var original = button.textContent;
        button.textContent = payload.shortLang === 'en' ? 'copied' : '已复制';
        setTimeout(function () { button.textContent = original; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        return;
      }
      fallbackCopy(text, done);
    },
    md: function () { download(payload.fileBase + '.md', new Blob([payload.markdown], { type: 'text/markdown;charset=utf-8' })); },
    mmd: function () { download(payload.fileBase + '.mmd', new Blob([payload.mermaid], { type: 'text/plain;charset=utf-8' })); },
    theme: function () { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); draw(); },
    delta: function () {
      var panel = document.getElementById('deltaPanel');
      panel.hidden = !panel.hidden;
    }
  };
  function fallbackCopy(text, done) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (error) { /* clipboard unavailable */ }
    area.remove();
  }
  document.addEventListener('click', function (event) {
    var action = event.target && event.target.getAttribute && event.target.getAttribute('data-act');
    if (action && actions[action]) actions[action](event.target);
  });
  document.getElementById('search').addEventListener('input', function (event) {
    search = event.target.value.trim();
    if (search) { expandToMatches(map.root); for (var depth = 0; depth < 12; depth++) expandToMatches(map.root); }
    render();
  });

  var deltaBar = document.getElementById('delta');
  if (delta) {
    var bar = document.getElementById('deltaText');
    var bits = [];
    bits.push(delta.previousTotal + ' → ' + delta.currentTotal);
    if (delta.added.length) bits.push((payload.shortLang === 'en' ? '+' : '新增 ') + delta.added.length);
    if (delta.removed.length) bits.push((payload.shortLang === 'en' ? '-' : '消失 ') + delta.removed.length);
    if (delta.movedCount) bits.push((payload.shortLang === 'en' ? '' : '层级调整 ') + delta.movedCount + (payload.shortLang === 'en' ? ' re-parented' : ''));
    bar.textContent = (payload.shortLang === 'en' ? 'vs. last run: ' : '较上次：') + bits.join(' · ');
    deltaBar.hidden = false;

    var panel = document.getElementById('deltaPanel');
    var section = function (title, labels, mark) {
      if (!labels.length) return;
      var head = document.createElement('div');
      head.className = 'deltaHead';
      head.textContent = title + '（' + labels.length + '）';
      panel.appendChild(head);
      for (var i = 0; i < labels.length; i++) {
        var row = document.createElement('div');
        row.className = 'deltaRow';
        row.textContent = mark + ' ' + labels[i];
        panel.appendChild(row);
      }
    };
    var zh = payload.shortLang !== 'en';
    section(zh ? '新增' : 'Added', delta.added, '+');
    section(zh ? '消失' : 'Removed', delta.removed, '−');
    if (delta.previousTitle || delta.previousGeneratedAt) {
      var meta = document.createElement('div');
      meta.className = 'deltaMeta';
      var when = delta.previousGeneratedAt ? new Date(delta.previousGeneratedAt).toLocaleString() : '';
      meta.textContent = (zh ? '对比基准：' : 'Compared with: ') + (delta.previousTitle || '') + (when ? ' · ' + when : '');
      panel.appendChild(meta);
    }
  }

  var legend = document.getElementById('legend');
  var used = {};
  (function walk(node) { used[node.kind] = true; for (var i = 0; i < (node.children || []).length; i++) walk(node.children[i]); })(map.root);
  Object.keys(used).forEach(function (kind) {
    var chip = document.createElement('span');
    chip.className = 'chip';
    var dot = document.createElement('i');
    dot.style.background = KIND_COLORS[kind] || KIND_COLORS.topic;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode((payload.kindLabels && payload.kindLabels[kind]) || kind));
    legend.appendChild(chip);
  });

  document.documentElement.setAttribute('data-theme', theme);
  render();
  fit();
})();
</script>
</body>
</html>
